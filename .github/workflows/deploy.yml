name: Deploy

# Same flow as openforge-catalog: feature PRs merge to `test` (→ staging); a release
# PR from `test` to `main` deploys production.
on:
  push:
    branches: [test, main]

# One run per branch at a time; a cancelled tofu apply leaves a held state lock.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.0"
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  deploy:
    name: Deploy — ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      ECR_REPO: autoblender

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref_name == 'main' && secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: autoblender-deploy-${{ env.ENVIRONMENT }}

      # openforge-infra names each account's state bucket after the account id.
      - name: State bucket for this account
        run: echo "TF_STATE_BUCKET=openforge-infra-tfstate-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push lambda image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
        run: |
          docker build --target lambda \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          for m in union cut api; do
            docker run --rm --entrypoint python $IMAGE:${{ github.sha }} -m autoblender.$m
          done
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: terraform
        run: |
          tofu init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=autoblender/${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: tofu apply
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_infra_state_bucket: ${{ env.TF_STATE_BUCKET }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: tofu apply -input=false -auto-approve
