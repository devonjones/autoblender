name: Deploy

on:
  push:
    branches: [main]        # → staging
  workflow_dispatch:      # → staging from any branch

# ponytail: staging only; a production job needs its own state key, env and role
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.0"

jobs:
  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_STATE_BUCKET: openforge-infra-tfstate-682033461796
      ECR_REPO: autoblender

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: autoblender-deploy-staging

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push lambda image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
        run: |
          docker build --target lambda \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: terraform
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=autoblender/staging/terraform.tfstate"

      - name: tofu apply
        working-directory: terraform
        env:
          TF_VAR_environment: staging
          TF_VAR_infra_state_bucket: ${{ env.TF_STATE_BUCKET }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_drive_root_folder_id: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
        run: tofu apply -input=false -auto-approve
